<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上下文用量</title>
<script src="/preload.js"></script>
<style>
  :root {
    --c-system: #9aa0a6;
    --c-user: #a8c7fa;
    --c-agent: #4c8df6;
    --c-tool: #f9ab00;
    --c-custom: #c58af9;
    --c-sysmsg: #f28b82;
    --c-ok: #81c995;
    --c-warn: #f9ab00;
    --c-danger: #f28b82;
    --fg: var(--foreground, #e3e3e3);
    --dim: var(--muted-foreground, #9aa0a6);
    --line: var(--border, rgba(127, 127, 127, .22));
    --surface: color-mix(in srgb, var(--fg) 3.5%, transparent);
    --surface-hover: color-mix(in srgb, var(--fg) 7.5%, transparent);
    --empty: color-mix(in srgb, var(--dim) 24%, transparent);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--fg);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* thin overlay-style scrollbar instead of the platform default */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-button { display: none; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--dim) 30%, transparent);
    border: 3px solid transparent;
    border-radius: 999px;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--dim) 55%, transparent); }

  /* preload.js zeroes the body's padding, so the page padding lives here */
  main { padding: 12px 14px 18px; }
  .dim { color: var(--dim); }
  .num { font-variant-numeric: tabular-nums; }

  /* hero card */
  .hero {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 12px 11px;
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .model {
    font-size: 12px; color: var(--dim);
    display: flex; align-items: center; gap: 6px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .live { width: 6px; height: 6px; border-radius: 50%; background: var(--empty); flex: none; }
  .live.on { background: var(--c-ok); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c-ok) 22%, transparent); }

  .usage { margin: 6px 0 11px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .usage .big { font-size: 24px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; }
  .usage .of { font-size: 12px; color: var(--dim); }
  .pct-pill {
    margin-left: auto;
    font-size: 11.5px;
    font-weight: 600;
    padding: 1px 8px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--fg) 7%, transparent);
    border: 1px solid var(--line);
    color: var(--fg);
  }
  .pct-pill.warn {
    color: var(--c-warn);
    background: color-mix(in srgb, var(--c-warn) 14%, transparent);
    border-color: color-mix(in srgb, var(--c-warn) 38%, transparent);
  }
  .pct-pill.danger {
    color: var(--c-danger);
    background: color-mix(in srgb, var(--c-danger) 15%, transparent);
    border-color: color-mix(in srgb, var(--c-danger) 42%, transparent);
  }

  button {
    font: inherit; font-size: 11.5px; color: var(--dim); cursor: pointer; white-space: nowrap;
    background: transparent; border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 8px; display: inline-flex; align-items: center; gap: 4px;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  button:hover { color: var(--fg); border-color: color-mix(in srgb, var(--dim) 60%, transparent); background: var(--surface-hover); }
  button.copied { color: var(--c-ok); border-color: color-mix(in srgb, var(--c-ok) 45%, transparent); }
  button svg { width: 12px; height: 12px; flex: none; }

  /* grid: each dot is 1% of the context window */
  .grid {
    display: grid;
    grid-template-columns: repeat(20, 1fr);
    gap: 5px;
    width: 100%;
    max-width: 340px;
  }
  .dot {
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--empty);
    transition: transform .12s ease, opacity .15s ease, background-color .15s ease;
  }
  .dot[data-segment] { cursor: pointer; }
  .dot[data-segment]:hover { transform: scale(1.22); }
  .dot:focus-visible { outline: 1.5px solid color-mix(in srgb, var(--fg) 55%, transparent); outline-offset: 2px; }
  .grid.has-highlight .dot:not(.is-highlighted) { opacity: .22; }
  .dot.is-highlighted[data-segment="free"] { background: color-mix(in srgb, var(--dim) 42%, transparent); }

  .grid-tooltip {
    position: fixed;
    z-index: 10;
    max-width: calc(100vw - 16px);
    padding: 6px 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--popover, var(--card, var(--background, #202124)));
    color: var(--popover-foreground, var(--fg));
    box-shadow: 0 6px 20px rgba(0, 0, 0, .28);
    backdrop-filter: blur(8px);
    font-size: 12px;
    pointer-events: none;
  }
  .grid-tooltip strong, .grid-tooltip span { display: block; }
  .grid-tooltip strong { font-weight: 600; margin-bottom: 1px; }
  .grid-tooltip span { color: var(--dim); font-variant-numeric: tabular-nums; }

  /* sections */
  section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  h2 {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
    color: var(--dim); margin: 0 0 7px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 11px; opacity: .85; }
  .note {
    font-size: 11.5px; color: var(--dim);
    margin: 0 0 8px; padding: 5px 8px;
    border-radius: 6px; background: var(--surface);
  }

  /* category rows + mini progress bar */
  .group + .group { margin-top: 6px; padding-top: 6px; border-top: 1px dashed color-mix(in srgb, var(--line) 80%, transparent); }
  .row {
    display: grid;
    grid-template-columns: 10px 1fr auto 44px;
    align-items: center;
    column-gap: 8px;
    row-gap: 3px;
    padding: 4px 6px;
    margin: 0 -6px;
    border-radius: 6px;
    transition: background .12s ease;
    cursor: default;
  }
  .row:hover, .row.is-highlighted { background: var(--surface-hover); }
  .row .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .tok { text-align: right; font-size: 12.5px; }
  .row .p { text-align: right; color: var(--dim); font-size: 11.5px; }
  .bar-track {
    grid-column: 2 / -1;
    height: 2.5px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--dim) 14%, transparent);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 999px;
    min-width: 2px;
    transition: width .25s ease;
  }
  .mark { width: 8px; height: 8px; border-radius: 50%; }
  .mark.sq { border-radius: 2px; }
  .mark.free { background: transparent; border: 1.5px solid var(--empty); }

  /* checkpoint card */
  .ck-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .ck-main { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; }
  .ck-sub { margin-top: 4px; font-size: 11.5px; color: var(--dim); }
  .badge {
    font-size: 10.5px; font-weight: 500;
    color: var(--c-ok);
    background: color-mix(in srgb, var(--c-ok) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--c-ok) 36%, transparent);
    border-radius: 999px;
    padding: 1px 7px;
    white-space: nowrap;
  }

  /* collapsible file groups */
  details.file-group { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  details.file-group summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--dim);
    user-select: none;
    padding: 2px 0;
  }
  details.file-group summary::-webkit-details-marker { display: none; }
  details.file-group summary:hover { color: var(--fg); }
  .sum-left { display: inline-flex; align-items: center; gap: 6px; }
  .chev {
    width: 12px; height: 12px;
    transition: transform .15s ease;
    opacity: .75;
  }
  details.file-group[open] .chev { transform: rotate(90deg); }
  .count-pill {
    font-size: 10.5px; font-weight: 500;
    padding: 0 6px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line);
    color: var(--dim);
  }
  .sum-right { font-weight: 400; font-size: 11px; opacity: .85; }

  .files { list-style: none; margin: 6px 0 0; padding: 0; }
  .files li {
    display: grid; grid-template-columns: 1fr auto; gap: 8px;
    padding: 4px 6px; margin: 0 -6px; border-radius: 6px;
  }
  .files li:hover { background: var(--surface-hover); }
  .files .name { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files .dir {
    display: block; font-size: 11px; color: var(--dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    direction: rtl; text-align: left;
  }
  .files .tok { color: var(--dim); font-size: 11.5px; align-self: center; }

  .empty { margin: 48px 8px; text-align: center; color: var(--dim); }
  footer {
    margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--dim);
    display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }
</style>
</head>
<body>
<main id="main"><p class="empty">正在读取上下文用量…</p></main>
<div id="grid-tooltip" class="grid-tooltip" aria-hidden="true" hidden>
  <strong></strong>
  <span></span>
</div>

<script>
(() => {
  const POLL_MS = 3000;
  const SEGMENT_INFO = {
    system: ['系统提示、工具与开销', 'var(--c-system)'],
    user: ['用户消息', 'var(--c-user)'],
    agent: ['智能体回复', 'var(--c-agent)'],
    tool: ['工具调用', 'var(--c-tool)'],
    system_messages: ['系统消息', 'var(--c-sysmsg)'],
    custom: ['自定义项', 'var(--c-custom)'],
    free: ['剩余空间', 'var(--empty)'],
  };
  const CONVERSATION = new Set(['user', 'agent', 'tool', 'system_messages']);
  const CATEGORY_NAMES = new Map([
    ['user', '用户消息'],
    ['agent', '智能体回复'],
    ['tool', '工具调用'],
    ['system_prompt', '系统提示词'],
    ['system_tools', '系统工具'],
    ['system_overhead', '系统开销'],
    ['rules', '规则'],
    ['skills', '技能'],
    ['subagents', '子智能体'],
    ['legacy_workflows', '旧版工作流'],
    ['workflows', '工作流'],
    ['plugins', '插件'],
    ['mcp_tools', 'MCP 工具'],
    ['system_messages', '系统消息'],
  ]);
  const ESTIMATE_NOTES = new Map([
    ['Estimated after compaction · updates next turn', '压缩后的估算值，下轮回复后更新'],
    ['Estimated usage (awaiting generation)', '当前为估算值，等待模型回复'],
  ]);
  const READ_ERROR = '暂时无法读取上下文用量，面板会自动重试。';
  const COPY_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V3.5a1.5 1.5 0 0 0-1.5-1.5H3.5A1.5 1.5 0 0 0 2 3.5V9a1.5 1.5 0 0 0 1.5 1.5h2"/></svg>';
  const CHECK_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5 6.5 11.5 12.5 4.5"/></svg>';
  const CHEV_ICON = '<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>';
  const COPY_LABEL = '复制文本';
  const SYSTEM = new Set(['system_prompt', 'system_tools', 'system_overhead']);
  const params = new URLSearchParams(location.search);
  const conversationId = (window.sidecar && window.sidecar.conversationId) || params.get('conversationId') || '';
  const doFetch = (window.sidecar && window.sidecar.fetch) || fetch;
  const main = document.getElementById('main');
  const tooltip = document.getElementById('grid-tooltip');
  const tooltipName = tooltip.querySelector('strong');
  const tooltipValue = tooltip.querySelector('span');
  const integer = new Intl.NumberFormat('zh-CN');
  let workspace = '';
  let report = null;
  let lastJson = '';
  let gridStats = new Map();
  let activeDot = null;
  let activeSegment = null;
  const openGroups = new Map();

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function fmtTok(n) {
    if (n >= 1e6) { const v = n / 1e6; return Number.isInteger(v) ? `${v}M` : `${v.toFixed(1)}M`; }
    if (n >= 1e3) return `${(n / 1e3).toFixed(1)}k`;
    return String(n);
  }

  // The CLI's cell allocation: at least one cell per non-empty segment, scaled down on overflow.
  function gridCells(segments, limit, total) {
    let counts = segments.map((t) => (!t || !limit ? 0 : Math.max(1, Math.floor(t / limit * total))));
    const used = counts.reduce((a, b) => a + b, 0);
    if (used > total) counts = counts.map((c) => Math.floor(c * total / used));
    return [...counts, total - counts.reduce((a, b) => a + b, 0)];
  }

  function grid(r) {
    const [system, user, agent, tool, custom] = r.grid_segments;
    const systemMessages = r.categories.find(({ key }) => key === 'system_messages')?.tokens ?? 0;
    const segments = Object.keys(SEGMENT_INFO);
    const totals = [system, user, agent, tool, systemMessages, custom, r.free_tokens];
    const counts = gridCells(totals.slice(0, -1), r.limit_tokens, 100);
    gridStats = new Map();
    const cells = segments.map((segment, i) => {
      const count = counts[i];
      const [name, color] = SEGMENT_INFO[segment];
      const tokens = totals[i];
      const share = r.limit_tokens ? tokens / r.limit_tokens * 100 : 0;
      const percent = share > 0 && share < .05 ? '少于 0.1%' : `${share.toFixed(1)}%`;
      const value = `${integer.format(tokens)} token · ${percent}`;
      gridStats.set(segment, { name, value });
      if (!count) return '';
      if (!r.limit_tokens) return '<span class="dot" aria-hidden="true"></span>'.repeat(count);

      const dot = `<span class="dot" data-segment="${segment}" style="background:${color}"`;
      return `${dot} tabindex="0" role="img" aria-label="${name}，${value}"></span>`
        + `${dot} aria-hidden="true"></span>`.repeat(count - 1);
    }).join('');
    return `<div class="grid" role="group" aria-label="上下文占用图，每个圆点约占 1%">${cells}</div>`;
  }

  function categoryRow(c) {
    const isConversation = CONVERSATION.has(c.key);
    const segment = isConversation ? c.key : SYSTEM.has(c.key) ? 'system' : 'custom';
    const [label, color] = SEGMENT_INFO[segment];
    const shape = isConversation ? '' : ' sq';
    const pctClamped = Math.max(0, Math.min(100, c.pct || 0));
    const bar = c.tokens > 0
      ? `<div class="bar-track" aria-hidden="true"><div class="bar-fill" style="width:${pctClamped.toFixed(2)}%;background:${color}"></div></div>`
      : '';
    return `<div class="row" data-segment="${segment}"><span class="mark${shape}" style="background:${color}"></span>`
      + `<span class="label">${esc(CATEGORY_NAMES.get(c.key) || c.name || label)}</span>`
      + `<span class="tok num">${fmtTok(c.tokens)}</span><span class="p num">${c.pct.toFixed(1)}%</span>${bar}</div>`;
  }

  function categories(r) {
    const conv = r.categories.filter((c) => CONVERSATION.has(c.key));
    const rest = r.categories.filter((c) => !CONVERSATION.has(c.key));
    const limit = r.limit_tokens;
    const freePct = limit ? (r.free_tokens / limit * 100) : 0;
    const free = `<div class="row" data-segment="free"><span class="mark free"></span><span class="label dim">剩余空间</span>`
      + `<span class="tok num dim">${fmtTok(r.free_tokens)}</span><span class="p num">${freePct.toFixed(1)}%</span></div>`;
    const estimate = ESTIMATE_NOTES.get(r.heading);
    const note = estimate ? `<p class="note">${estimate}</p>` : '';
    const buffer = r.checkpoint_buffer
      ? `<p class="note" style="margin-top:8px;margin-bottom:0">检查点缓冲区 · ${fmtTok(r.checkpoint_buffer)} token（不计入占用）</p>` : '';
    return `<section><h2>Token 分布 <span class="hint">悬停可联动高亮</span></h2>${note}
      <div class="group">${conv.map(categoryRow).join('')}</div>
      ${rest.length ? `<div class="group">${rest.map(categoryRow).join('')}</div>` : ''}
      <div class="group">${free}</div>${buffer}</section>`;
  }

  function checkpoints(r) {
    const ck = r.checkpoint_view;
    if (!ck) return '';
    const older = ck.historical ? `<div class="ck-sub">已有 ${ck.historical} 个历史检查点被摘要，未计入当前上下文</div>` : '';
    const detail = ck.active_text.replace(/^steps (\d+)–(\d+)$/, '步骤 $1–$2');
    return `<section><h2>检查点 <span class="hint">${ck.count} · /rewind</span></h2>
      <div class="ck-card"><div class="ck-main"><span>检查点 ${ck.active_number} · ${esc(detail)}</span><span class="badge">当前上下文</span></div>${older}</div></section>`;
  }

  function splitPath(path) {
    const trimmed = path.replace(/\/$/, '');
    const i = trimmed.lastIndexOf('/');
    const name = trimmed.slice(i + 1) + (path.endsWith('/') ? '/' : '');
    let dir = i > 0 ? trimmed.slice(0, i) : '';
    if (conversationId) dir = dir.replace(new RegExp(`^.*/brain/${conversationId}`), '会话目录');
    return { name, dir };
  }

  function files(id, title, hint, items) {
    if (!items || !items.length) return '';
    const isOpen = openGroups.has(id) ? openGroups.get(id) : items.length <= 6;
    const totalTok = items.reduce((sum, f) => sum + (f.tokens > 0 ? f.tokens : 0), 0);
    const sumRight = totalTok > 0 ? `${fmtTok(totalTok)} · ${hint}` : hint;
    const rows = items.map((f) => {
      const { name, dir } = splitPath(f.path);
      return `<li title="${esc(f.path)}"><span class="name">${esc(name)}<span class="dir">‎${esc(dir)}</span></span>`
        + `<span class="tok num">${f.tokens > 0 ? fmtTok(f.tokens) : ''}</span></li>`;
    }).join('');
    return `<details class="file-group" data-group="${id}"${isOpen ? ' open' : ''}>
      <summary><span class="sum-left">${CHEV_ICON}<span>${title}</span><span class="count-pill num">${items.length}</span></span><span class="sum-right num">${sumRight}</span></summary>
      <ul class="files">${rows}</ul>
    </details>`;
  }

  function mcpServers(items) {
    if (!items || !items.length) return '';
    const isOpen = openGroups.has('mcp') ? openGroups.get('mcp') : items.length <= 6;
    const totalTok = items.reduce((sum, s) => sum + (s.tokens > 0 ? s.tokens : 0), 0);
    const sumRight = totalTok > 0 ? `${fmtTok(totalTok)} · MCP` : 'MCP';
    const rows = items.map((s) => {
      const meta = [s.source, s.transport].filter(Boolean).join(' · ');
      return `<li title="${esc(s.name)}"><span class="name">${esc(s.name)}<span class="dir">${esc(meta)}</span></span>`
        + `<span class="tok num">${s.tokens > 0 ? fmtTok(s.tokens) : ''}</span></li>`;
    }).join('');
    return `<details class="file-group" data-group="mcp"${isOpen ? ' open' : ''}>
      <summary><span class="sum-left">${CHEV_ICON}<span>MCP 服务</span><span class="count-pill num">${items.length}</span></span><span class="sum-right num">${sumRight}</span></summary>
      <ul class="files">${rows}</ul>
    </details>`;
  }

  function pctClass(pct) {
    if (pct >= 85) return ' danger';
    if (pct >= 70) return ' warn';
    return '';
  }

  function render(r) {
    const focusedSegment = document.activeElement?.matches('.dot:focus-visible')
      ? document.activeElement.dataset.segment : null;
    const hoverRect = activeDot && !focusedSegment ? activeDot.getBoundingClientRect() : null;
    clearHighlight();
    const limit = r.limit_tokens;
    const pctBadge = limit
      ? `<span class="pct-pill num${pctClass(r.used_pct)}">${r.used_pct.toFixed(1)}%</span>`
      : '';
    main.innerHTML = `
      <div class="hero">
        <div class="top">
          <div class="model" title="${esc(r.model === 'Unknown Model' ? '未知模型' : r.model)}"><span class="live on" title="自动刷新"></span>${esc(r.model === 'Unknown Model' ? '未知模型' : r.model)}</div>
          <button id="copy" title="复制 CLI 格式的文本报告">${COPY_ICON}<span>${COPY_LABEL}</span></button>
        </div>
        <div class="usage">
          <span class="big num">${fmtTok(r.used_tokens)}</span>
          <span class="of">/ ${limit ? fmtTok(limit) : '未知'} token</span>
          ${pctBadge}
        </div>
        ${grid(r)}
      </div>
      ${categories(r)}
      ${checkpoints(r)}
      ${files('knowledge', '知识文件', '/rules', r.knowledge_files)}
      ${files('artifact', '产物文件', '/artifact', r.artifact_files)}
      ${files('skill', '技能文件', '/skill', r.skill_files)}
      ${mcpServers(r.mcp_servers)}
      ${files('system', '系统文件', '自动加载', r.system_files)}
      <footer><span>/artifact · /skill · /rewind</span><span class="num">更新于 ${esc(new Date(r.updatedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }))}</span></footer>`;
    document.getElementById('copy').addEventListener('click', copy);
    main.querySelectorAll('details.file-group').forEach((el) => {
      el.addEventListener('toggle', () => openGroups.set(el.dataset.group, el.open));
    });
    if (focusedSegment) {
      main.querySelector(`.dot[tabindex][data-segment="${focusedSegment}"]`)?.focus({ preventScroll: true });
    } else if (hoverRect) {
      const underPointer = document.elementFromPoint(hoverRect.x + hoverRect.width / 2, hoverRect.y + hoverRect.height / 2);
      if (underPointer?.matches('.dot[data-segment]:hover')) showGridTooltip(underPointer);
    }
  }

  function showMessage(text) {
    clearHighlight();
    report = null;
    lastJson = '';
    main.innerHTML = `<p class="empty">${esc(text)}</p>`;
  }

  async function copy(event) {
    if (!report) return;
    const btn = event.currentTarget;
    let copied = true;
    try {
      await navigator.clipboard.writeText(report.text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = report.text;
      document.body.appendChild(ta);
      ta.select();
      try {
        copied = document.execCommand('copy');
      } catch {
        copied = false;
      } finally {
        ta.remove();
      }
    }
    btn.classList.toggle('copied', copied);
    btn.innerHTML = copied ? `${CHECK_ICON}<span>已复制</span>` : `${COPY_ICON}<span>复制失败</span>`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `${COPY_ICON}<span>${COPY_LABEL}</span>`;
    }, 1500);
  }

  async function refresh() {
    if (document.hidden) return;
    try {
      const qs = new URLSearchParams({ conversationId, workspace });
      const res = await doFetch(`/api/report?${qs}`);
      const data = await res.json();
      if (data.error === 'no-conversation') return showMessage('打开一个会话后即可查看上下文用量。');
      if (data.error === 'no-database') return showMessage('这个会话还没有保存的用量数据，发送一条消息后再查看。');
      if (data.error) return showMessage(READ_ERROR);
      const json = JSON.stringify(data);
      if (json === lastJson) {
        const dot = document.querySelector('.live');
        if (dot) {
          dot.classList.add('on');
          dot.title = '自动刷新';
        }
        return;
      }
      lastJson = json;
      report = data;
      render(data);
    } catch {
      const dot = document.querySelector('.live');
      if (dot) {
        dot.classList.remove('on');
        dot.title = '刷新失败，显示上次读取的用量';
      } else {
        showMessage(READ_ERROR);
      }
    }
  }

  function highlightSegment(segment) {
    if (activeSegment === segment) return;
    clearHighlight();
    activeSegment = segment;
    main.querySelector('.grid')?.classList.add('has-highlight');
    main.querySelectorAll(`[data-segment="${segment}"]`).forEach((entry) => entry.classList.add('is-highlighted'));
  }

  function clearHighlight() {
    if (!activeDot && !activeSegment) return;
    main.querySelector('.grid')?.classList.remove('has-highlight');
    main.querySelectorAll('.is-highlighted').forEach((entry) => entry.classList.remove('is-highlighted'));
    tooltip.hidden = true;
    activeDot = null;
    activeSegment = null;
  }

  function showGridTooltip(dot) {
    const { segment } = dot.dataset;
    const stats = gridStats.get(segment);
    if (!stats || dot === activeDot) return;

    highlightSegment(segment);
    activeDot = dot;
    tooltipName.textContent = stats.name;
    tooltipValue.textContent = stats.value;
    tooltip.hidden = false;

    const anchor = dot.getBoundingClientRect();
    const box = tooltip.getBoundingClientRect();
    const chart = dot.parentElement.getBoundingClientRect();
    const left = anchor.left + (anchor.width - box.width) / 2;
    const below = chart.bottom + 8;
    const above = chart.top - box.height - 8;
    const top = below + box.height <= innerHeight - 8 ? below : Math.max(8, above);
    tooltip.style.left = `${Math.max(8, Math.min(left, innerWidth - box.width - 8))}px`;
    tooltip.style.top = `${top}px`;
  }

  main.addEventListener('pointerover', (event) => {
    const dot = event.target.closest('.dot[data-segment]');
    if (dot) return showGridTooltip(dot);
    const row = event.target.closest('.row[data-segment]');
    if (row) {
      tooltip.hidden = true;
      activeDot = null;
      highlightSegment(row.dataset.segment);
    }
  });
  main.addEventListener('pointerout', (event) => {
    const relatedDot = event.relatedTarget?.closest?.('.dot[data-segment]');
    const relatedRow = event.relatedTarget?.closest?.('.row[data-segment]');
    if (relatedDot || relatedRow) return;
    if (document.activeElement?.matches('.dot:focus-visible')) showGridTooltip(document.activeElement);
    else clearHighlight();
  });
  main.addEventListener('focusin', (event) => {
    if (event.target.matches('.dot[data-segment]')) showGridTooltip(event.target);
  });
  main.addEventListener('focusout', (event) => {
    if (event.target === activeDot) clearHighlight();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') clearHighlight();
  });
  window.addEventListener('resize', clearHighlight);
  window.addEventListener('scroll', clearHighlight, { passive: true });

  document.addEventListener('visibilitychange', refresh);

  async function start() {
    if (window.sidecar && window.sidecar.getWorkspaceUris) {
      const uris = await window.sidecar.getWorkspaceUris();
      workspace = uris[0] || '';
      window.sidecar.onWorkspaceChange((next) => {
        if ((next[0] || '') !== workspace) { workspace = next[0] || ''; lastJson = ''; refresh(); }
      });
    }
    refresh();
    setInterval(refresh, POLL_MS);
  }
  start();
})();
</script>
</body>
</html>
