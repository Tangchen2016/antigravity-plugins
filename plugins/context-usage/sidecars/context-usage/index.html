<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上下文用量</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: var(--foreground, CanvasText);
      --muted: color-mix(in srgb, var(--ink) 66%, var(--background, Canvas));
      --edge: var(--border, color-mix(in srgb, var(--ink) 13%, transparent));
      --surface: var(--card, color-mix(in srgb, var(--ink) 4%, Canvas));
      --track: color-mix(in srgb, var(--ink) 12%, transparent);
      --messages: light-dark(#3869bf, #81aaff);
      --tools: light-dark(#26796e, #66b7aa);
      --system: light-dark(#7656a5, #aa92cd);
      --other: light-dark(#667181, #909aa9);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font: 13px/1.5 system-ui, sans-serif;
      background: var(--background, Canvas);
      color: var(--ink);
    }

    main { padding: 16px; }
    h1, h2, p, dl, dd { margin: 0; }
    h1, h2 { font-size: 13px; font-weight: 600; }
    .muted { color: var(--muted); }
    .num { font-variant-numeric: tabular-nums; }

    .summary {
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--edge);
      border-radius: 12px;
    }

    .summary-header, .stats {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px 16px;
      flex-wrap: wrap;
    }

    #percentage {
      margin-top: 4px;
      font-size: 36px;
      font-weight: 600;
      letter-spacing: -.04em;
      line-height: 1.1;
    }

    .stats { margin-top: 12px; }
    .stats dt { font-size: 11px; }
    .stats dd { white-space: nowrap; font-size: 12px; }
    .stats .available { text-align: right; }
    .stats .available dd { font-weight: 600; }

    .cells {
      display: grid;
      grid-template-columns: repeat(20, minmax(0, 1fr));
      gap: 4px;
      margin-top: 16px;
    }

    .cell {
      min-width: 0;
      height: 8px;
      background: var(--track);
      border-radius: 2px;
    }

    .messages { --swatch: var(--messages); }
    .tools { --swatch: var(--tools); }
    .system { --swatch: var(--system); }
    .other { --swatch: var(--other); }
    .cell[data-kind] { background: var(--swatch); }

    .section { margin-top: 20px; }
    table {
      width: 100%;
      margin-top: 8px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      padding: 8px 0;
      border-bottom: 1px solid var(--edge);
      vertical-align: baseline;
      text-align: left;
      overflow-wrap: anywhere;
    }

    td { text-align: right; }
    th[scope="row"] { font-weight: 400; }

    thead th {
      padding-top: 0;
      font-size: 11px;
      font-weight: 400;
    }

    thead th:not(:first-child) { text-align: right; }
    thead th:nth-child(2) { width: 76px; }
    thead th:nth-child(3) { width: 60px; }

    .label {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .label::before {
      content: "";
      flex: 0 0 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--swatch);
    }

    #status { margin-top: 8px; }
    #refresh-state { text-align: end; font-size: 11px; }
  </style>
</head>
<body>
  <main>
    <section class="summary" aria-labelledby="title">
      <div class="summary-header">
        <h1 id="title">会话占用</h1>
        <p id="refresh-state" class="muted" hidden>每格约 1%</p>
      </div>
      <p id="status" class="muted" role="status">正在读取当前会话…</p>
      <div id="usage" hidden>
        <p id="percentage" class="num"></p>
        <div id="cells" class="cells" aria-hidden="true"></div>
        <dl class="stats">
          <div>
            <dt class="muted">已用 / 有效上限</dt>
            <dd id="counts" class="num"></dd>
          </div>
          <div class="available">
            <dt class="muted">剩余 token</dt>
            <dd id="remaining" class="num"></dd>
          </div>
        </dl>
      </div>
    </section>

    <section id="breakdown" class="section" aria-labelledby="details-title" hidden>
      <h2 id="details-title">用量明细</h2>
      <table aria-labelledby="details-title">
        <thead class="muted">
          <tr>
            <th scope="col">类别</th>
            <th scope="col">Token</th>
            <th scope="col">占上限</th>
          </tr>
        </thead>
        <tbody id="groups"></tbody>
      </table>
    </section>
  </main>
  <script src="/preload.js"></script>
  <script>
    const byId = (id) => document.getElementById(id);
    const status = byId('status');
    const usage = byId('usage');
    const groups = byId('groups');
    const refreshState = byId('refresh-state');
    const bridge = window.sidecar;
    const conversationId = bridge?.conversationId;
    const number = new Intl.NumberFormat('zh-CN');
    const percent = new Intl.NumberFormat('zh-CN', { style: 'percent', maximumFractionDigits: 1 });
    const categories = new Map([
      ['messages', ['会话消息', 'messages']],
      ['chat messages', ['会话消息', 'messages']],
      ['conversation', ['会话消息', 'messages']],
      ['system prompt', ['系统提示词', 'system']],
      ['system instructions', ['系统指令', 'system']],
      ['tools', ['工具定义', 'tools']],
      ['tool definitions', ['工具定义', 'tools']],
      ['system tools', ['内置工具', 'tools']],
      ['mcp tools', ['MCP 工具', 'tools']],
      ['memory files', ['记忆文件', 'other']],
      ['skills', ['技能', 'other']],
    ]);
    const messages = {
      'no-conversation': '打开一个会话后即可查看用量',
      pending: 'Antigravity 尚未返回用量，面板会自动刷新',
      unavailable: '暂时无法读取用量，面板会自动重试',
    };
    let lastReport = '';

    function renderGrid(rows, used, limit) {
      const total = rows.reduce((sum, row) => sum + row.tokens, 0);
      // Keep the filled area tied to reported usage, even if the breakdown is incomplete.
      const segments = total > used ? [] : [...rows];
      const remaining = used - (total > used ? 0 : total);
      if (remaining > 0) segments.push({ kind: 'other', tokens: remaining });

      const cells = [];
      let cumulative = 0;
      for (const segment of segments) {
        cumulative += segment.tokens;
        const end = Math.min(100, Math.round(cumulative / limit * 100));
        while (cells.length < end) {
          const cell = document.createElement('span');
          cell.className = `cell ${segment.kind}`;
          cell.dataset.kind = segment.kind;
          cells.push(cell);
        }
      }
      while (cells.length < 100) {
        const cell = document.createElement('span');
        cell.className = 'cell';
        cells.push(cell);
      }
      byId('cells').replaceChildren(...cells);
    }

    function renderRows(rows, limit) {
      groups.replaceChildren(...rows.map(({ label, kind, tokens }) => {
        const row = document.createElement('tr');
        row.className = kind;
        const title = document.createElement('th');
        title.scope = 'row';
        const name = document.createElement('span');
        name.className = 'label';
        name.textContent = label;
        title.append(name);
        const count = document.createElement('td');
        count.className = 'num';
        count.textContent = number.format(tokens);
        const share = document.createElement('td');
        share.className = 'num muted';
        share.textContent = percent.format(tokens / limit);
        row.append(title, count, share);
        return row;
      }));
      byId('breakdown').hidden = rows.length === 0;
    }

    function render(data) {
      if (data.state !== 'ready') {
        if (data.state === 'unavailable' && lastReport) {
          refreshState.hidden = false;
          refreshState.textContent = '刷新失败 · 显示上次用量';
          return;
        }
        lastReport = '';
        usage.hidden = true;
        byId('breakdown').hidden = true;
        refreshState.hidden = true;
        status.hidden = false;
        status.textContent = messages[data.state] || messages.unavailable;
        return;
      }

      refreshState.hidden = false;
      refreshState.textContent = '每格约 1%';
      const report = JSON.stringify(data);
      if (report === lastReport) return;
      lastReport = report;

      const rows = data.groups.map(({ name, type, tokens }) => {
        const [label, kind] = categories.get(name?.trim().toLowerCase())
          || categories.get(type?.trim().toLowerCase())
          || [name || '其他', 'other'];
        return { label, kind, tokens };
      }).sort((a, b) => b.tokens - a.tokens);

      byId('percentage').textContent = percent.format(data.used / data.limit);
      byId('counts').textContent = `${number.format(data.used)} / ${number.format(data.limit)}`;
      byId('remaining').textContent = number.format(Math.max(0, data.limit - data.used));

      renderGrid(rows, data.used, data.limit);
      renderRows(rows, data.limit);
      status.hidden = true;
      usage.hidden = false;
    }

    async function refresh() {
      if (!document.hidden) {
        try {
          const response = await bridge.fetch('/api/usage', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ conversationId }),
          });
          render(response.ok ? await response.json() : { state: 'unavailable' });
        } catch {
          render({ state: 'unavailable' });
        }
      }
      setTimeout(refresh, 5000);
    }

    if (conversationId) refresh();
    else render({ state: 'no-conversation' });
  </script>
</body>
</html>
